[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-forecast"
version = "0.0.1"
description = "RetailPanel-based innovation forecasting (distribution x velocity decomposition)"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
forecast-analog = "retail_forecast.cli:predict_analog_main"
forecast-ensemble = "retail_forecast.cli:predict_ensemble_main"
forecast-backtest-calibrate = "retail_forecast.cli:backtest_and_calibrate_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["retail_forecast*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["retail_forecast"]
