model_name: meta-llama/Llama-3.1-8B-Instruct
tokenizer_name: null
output_dir: outputs
system_prompt: You are a helpful, concise assistant.

seed: 42
tf32: true
overwrite_output_dir: true

preset: balanced

unsloth:
  enable: true
  max_seq_len:
    fast: 1536
    balanced: 2048
    thorough: 3072

lora:
  qlora: true
  load_in_4bit: true
  r:
    fast: 8
    balanced: 8
    thorough: 16
  alpha: 32
  dropout: 0.0
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

sft:
  train_file: data/pack/sft.jsonl
  val_file: data/pack/sft.jsonl
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  max_seq_len:
    fast: 1536
    balanced: 2048
    thorough: 3072
  lr: 2e-4
  warmup_ratio: 0.03
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  max_steps:
    fast: 400
    balanced: 800
    thorough: 1500
  lr_scheduler_type: cosine

pref_max_seq_len:
  fast: 1024
  balanced: 1152
  thorough: 1536

pref_max_prompt_len:
  fast: 512
  balanced: 576
  thorough: 768

dpo:
  train_file: data/pack/dpo.jsonl
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 18
  lr: 5e-6
  logging_steps: 10
  save_steps: 400
  save_total_limit: 2
  beta: 0.1
  # SimPO via CPOTrainer
  # beta: 2.0 to 2.5
  simpo_gamma: 0.5
  max_steps:
    fast: 300
    balanced: 600
    thorough: 1000
  precompute_ref_log_probs:
    fast: false
    balanced: true
    thorough: true
  reference_free:
    fast: true
    balanced: false
    thorough: false
  group_by_length: true

demo:
  port: 7860
  blocklist:
    - "ignore previous"
    - "jailbreak"
    - "do anything now"
    - "bypass safety"
    - "how to make a bomb"
    - "make explosives"

api:
  host: 127.0.0.1
  port: 8000

generation:
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9

rag:
  enabled: false
  default_collection: default
  embed_backend: auto 
  embed_model: BAAI/bge-small-en-v1.5
  rerank: false
  reranker_model: BAAI/bge-reranker-base
  top_k:
    fast: 2
    balanced: 3
    thorough: 4
  ctx_tokens:
    fast: 800
    balanced: 1200
    thorough: 1600
  chunk_tokens:
    fast: 256
    balanced: 300
    thorough: 350
  overlap_tokens:
    fast: 32
    balanced: 40
    thorough: 48
